name: Trump Trading Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar ausführen
        env:
          TEST_TELEGRAM: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUMP_FEED_URL: ${{ secrets.TRUMP_FEED_URL }}
        run: python radar.py

      - name: Verarbeitete Beiträge speichern
        run: |
          if [ -f seen_posts.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_posts.json
            if ! git diff --cached --quiet; then
              git commit -m "Update processed posts"
              git push
            fi
          fi
