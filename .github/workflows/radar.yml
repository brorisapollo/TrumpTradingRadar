name: Trump Trading Radar

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Feed pruefen; keine Telegram-Meldungen oder Statusaenderungen"
        type: boolean
        default: true
  schedule:
    - cron: "2-57/5 * * * *"

# One group across scheduled/manual runs and branches. Never cancel a sender.
concurrency:
  group: trump-trading-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUMP_FEED_URL: ${{ secrets.TRUMP_FEED_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python radar.py --dry-run
          else
            python radar.py
          fi
